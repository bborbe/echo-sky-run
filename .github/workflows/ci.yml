name: CI

# Runs the fast test tier and the production build on every PR and every master merge commit, off the
# deploy path: pages.yml does not test, so a merge reaches the live site in about a minute. The slow
# tier runs in release.yml (v* tags) and nightly.yml (master).
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test (fast tier)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Play level 1-1 in a real browser
        run: |
          npx vite preview --port 4187 --strictPort &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://localhost:4187/echo-sky-run/"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::vite preview never bound port 4187"
            exit 1
          fi
          E2E_URL=http://localhost:4187/echo-sky-run/ SHOT_PATH=echo-sky-run-1-1.png npm run e2e
      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: echo-sky-run-1-1.png
          if-no-files-found: ignore
